<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Buscador de Alta Fidelidad | Media Tracker</title>
    <!-- Tailwind CSS CDN with Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome for Icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <style data-purpose="custom-theme">
      body {
        font-family: "Inter", sans-serif;
        background-color: #0f1117;
        color: #f3f4f6;
      }
      .hero-gradient {
        background: radial-gradient(
          circle at top,
          rgba(139, 92, 246, 0.15) 0%,
          rgba(15, 17, 23, 1) 70%
        );
      }
      .glass-search {
        background: rgba(26, 29, 36, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .filter-btn.active {
        background-color: #8b5cf6;
        color: white;
        box-shadow:
          0 10px 15px -3px rgba(88, 28, 135, 0.2),
          0 4px 6px -2px rgba(88, 28, 135, 0.1);
        border-color: transparent;
      }
      .filter-btn:not(.active) {
        background-color: #1a1d24;
        color: #d1d5db;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .loader {
        border-top-color: #8b5cf6;
        -webkit-animation: spinner 1.5s linear infinite;
        animation: spinner 1.5s linear infinite;
      }
      @keyframes spinner {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <header
      class="relative pt-20 pb-12 hero-gradient overflow-hidden flex-shrink-0"
      data-purpose="main-header"
    >
      <div class="container mx-auto px-4 text-center">
        <h1
          class="text-5xl md:text-7xl font-extrabold tracking-tighter mb-4 text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400"
        >
          Buscador de Alta Fidelidad
        </h1>
        <p
          class="text-gray-400 text-lg md:text-xl font-light tracking-wide max-w-2xl mx-auto"
        >
          Explora la mejor calidad cinematográfica disponible. Sin esperas, solo
          fidelidad.
        </p>
      </div>
    </header>

    <main
      class="container mx-auto px-4 -mt-8 relative z-10 flex-grow"
      data-purpose="search-section"
    >
      <div class="max-w-4xl mx-auto">
        <form
          id="searchForm"
          class="glass-search rounded-2xl p-6 shadow-2xl mb-8"
        >
          <input type="hidden" id="min_size_gb" name="min_size_gb" value="5" />
          <input
            type="hidden"
            id="quality_tag"
            name="quality_tag"
            value="1080p"
          />

          <div class="relative mb-6">
            <span
              class="absolute inset-y-0 left-0 pl-5 flex items-center text-gray-500"
            >
              <i class="fas fa-search text-xl"></i>
            </span>
            <input
              id="query"
              name="query"
              required
              class="w-full bg-[#13161d] border-none text-white text-lg rounded-xl pl-14 pr-4 py-5 focus:ring-2 focus:ring-violet-500 transition-all placeholder:text-gray-600 outline-none"
              placeholder="Buscar películas, series o documentales..."
              type="text"
              autocomplete="off"
            />

            <button
              type="submit"
              id="searchBtn"
              class="absolute inset-y-2 right-2 px-6 bg-violet-600 hover:bg-violet-700 text-white font-bold rounded-lg transition-colors flex items-center gap-2"
            >
              <span id="btnText">Buscar</span>
              <div
                id="btnSpinner"
                class="hidden w-5 h-5 border-2 border-white rounded-full loader hidden"
              ></div>
            </button>
          </div>

          <!-- CATEGORY FILTERS -->
          <div
            class="flex flex-wrap items-center justify-center gap-4 mb-4"
            data-purpose="category-filters"
          >
            <label
              class="cursor-pointer flex items-center gap-2 text-gray-300 hover:text-white transition-colors"
            >
              <input
                type="radio"
                name="category"
                value="all"
                class="text-violet-500 bg-[#1a1d24] border-gray-600 focus:ring-violet-500"
                checked
              />
              <span class="font-semibold text-sm">Todos</span>
            </label>
            <label
              class="cursor-pointer flex items-center gap-2 text-gray-300 hover:text-white transition-colors"
            >
              <input
                type="radio"
                name="category"
                value="movies"
                class="text-violet-500 bg-[#1a1d24] border-gray-600 focus:ring-violet-500"
              />
              <span class="font-semibold text-sm">Películas</span>
            </label>
            <label
              class="cursor-pointer flex items-center gap-2 text-gray-300 hover:text-white transition-colors"
            >
              <input
                type="radio"
                name="category"
                value="tv"
                class="text-violet-500 bg-[#1a1d24] border-gray-600 focus:ring-violet-500"
              />
              <span class="font-semibold text-sm">Series</span>
            </label>
            <label
              class="cursor-pointer flex items-center gap-2 text-gray-300 hover:text-white transition-colors"
            >
              <input
                type="radio"
                name="category"
                value="docs"
                class="text-violet-500 bg-[#1a1d24] border-gray-600 focus:ring-violet-500"
              />
              <span class="font-semibold text-sm">Documentales</span>
            </label>
          </div>

          <div
            class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"
            id="advancedSettings"
            style="display: none"
          >
            <div>
              <label class="block text-sm font-semibold text-gray-400 mb-1"
                >Tamaño Mínimo (GB)</label
              >
              <input
                type="number"
                id="visible_min_size"
                value="5"
                min="0"
                step="0.5"
                class="w-full bg-[#1a1d24] border border-white/10 text-white rounded-lg px-4 py-2 focus:ring-1 focus:ring-violet-500 outline-none"
              />
            </div>
          </div>

          <div
            class="flex flex-wrap items-center justify-center gap-3"
            data-purpose="quality-filters"
          >
            <span
              class="text-sm font-semibold text-gray-400 uppercase tracking-widest mr-2 cursor-pointer hover:text-white transition-colors"
              onclick="
                document.getElementById('advancedSettings').style.display =
                  document.getElementById('advancedSettings').style.display ===
                  'none'
                    ? 'grid'
                    : 'none'
              "
            >
              <i class="fas fa-cog"></i> Filtros:
            </span>
            <button
              type="button"
              class="filter-btn px-5 py-2 rounded-full text-sm font-bold transition-all"
              data-value=""
            >
              ALL
            </button>
            <button
              type="button"
              class="filter-btn px-5 py-2 rounded-full text-sm font-bold transition-all"
              data-value="REMUX"
            >
              REMUX
            </button>
            <button
              type="button"
              class="filter-btn px-5 py-2 rounded-full text-sm font-bold transition-all"
              data-value="2160p"
            >
              4K UHD
            </button>
            <button
              type="button"
              class="filter-btn active px-5 py-2 rounded-full text-sm font-bold transition-all"
              data-value="1080p"
            >
              1080p
            </button>
            <button
              type="button"
              class="filter-btn px-5 py-2 rounded-full text-sm font-bold transition-all"
              data-value="WEBRip"
            >
              WEBRip
            </button>
          </div>
        </form>

        <div
          id="errorBox"
          class="hidden bg-red-500/10 border border-red-500/50 text-red-400 px-6 py-4 rounded-xl mb-8 flex items-center gap-4"
        >
          <i class="fas fa-exclamation-triangle text-xl"></i>
          <p id="errorMessage" class="font-medium"></p>
        </div>
      </div>

      <section
        id="resultsSection"
        class="hidden pb-12"
        data-purpose="results-display"
      >
        <h2
          id="resultsCount"
          class="text-gray-400 text-sm font-semibold uppercase tracking-wider mb-6 ml-2"
        >
          OBRAS ENCONTRADAS (0)
        </h2>
        <div id="resultsList" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
          <!-- Injected via JS -->
        </div>
      </section>
    </main>

    <footer
      class="containter mx-auto px-4 py-8 border-t border-white/5 mt-auto text-center flex-shrink-0"
      data-purpose="main-footer"
    >
      <p class="text-gray-500 text-sm">
        © 2026 Buscador de Alta Fidelidad. Diseñado para entusiastas del cine.
      </p>
    </footer>

    <script>
      const filterBtns = document.querySelectorAll(".filter-btn");
      const qualityInput = document.getElementById("quality_tag");
      const visibleMinSize = document.getElementById("visible_min_size");
      const hiddenMinSize = document.getElementById("min_size_gb");

      visibleMinSize.addEventListener(
        "input",
        (e) => (hiddenMinSize.value = e.target.value),
      );

      filterBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          filterBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          qualityInput.value = btn.getAttribute("data-value");
        });
      });

      document
        .getElementById("searchForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const query = document.getElementById("query").value;
          const minSize = hiddenMinSize.value;
          const qualityTag = qualityInput.value;
          const category =
            document.querySelector('input[name="category"]:checked')?.value ||
            "all";

          const btnText = document.getElementById("btnText");
          const btnSpinner = document.getElementById("btnSpinner");
          const searchBtn = document.getElementById("searchBtn");
          const resultsSection = document.getElementById("resultsSection");
          const resultsList = document.getElementById("resultsList");
          const resultsCount = document.getElementById("resultsCount");
          const errorBox = document.getElementById("errorBox");
          const errorMessage = document.getElementById("errorMessage");

          searchBtn.disabled = true;
          searchBtn.classList.add("opacity-75", "cursor-not-allowed");
          btnText.textContent = "Buscando...";
          btnSpinner.classList.remove("hidden");

          resultsSection.classList.add("hidden");
          errorBox.classList.add("hidden");
          resultsList.innerHTML = "";

          try {
            const params = new URLSearchParams({
              query: query,
              min_size_gb: minSize,
              quality_tag: qualityTag,
              category: category,
            });

            const response = await fetch(`/api/search?${params.toString()}`);
            const data = await response.json();

            if (!response.ok) {
              throw new Error(
                data.error || "Ocurrió un error en el servidor backend.",
              );
            }

            if (data.results.length === 0) {
              throw new Error(
                "No se encontraron resultados que superen los filtros de tamaño o calidad para esta búsqueda.",
              );
            }

            resultsCount.textContent = `${data.results.length} OBRAS ENCONTRADAS`;
            resultsSection.classList.remove("hidden");

            const fragment = document.createDocumentFragment();

            const getQualityBadge = (title) => {
              const text = title.toLowerCase();
              if (text.includes("remux"))
                return {
                  class:
                    "bg-violet-500/10 text-violet-400 border-violet-500/20",
                  text: "REMUX",
                };
              if (text.includes("2160p") || text.includes("4k"))
                return {
                  class: "bg-blue-500/10 text-blue-400 border-blue-500/20",
                  text: "4K UHD",
                };
              if (text.includes("1080p"))
                return {
                  class: "bg-green-500/10 text-green-400 border-green-500/20",
                  text: "1080p",
                };
              if (text.includes("webrip") || text.includes("web-dl"))
                return {
                  class:
                    "bg-yellow-500/10 text-yellow-400 border-yellow-500/20",
                  text: "WEB-DL",
                };
              return {
                class: "bg-gray-500/10 text-gray-400 border-gray-500/20",
                text: "BDRip / Estándar",
              };
            };

            const getSpanishBadge = (supportType) => {
              if (!supportType) return "";
              let colorClass =
                "bg-orange-500/10 text-orange-400 border-orange-500/20";
              let icon = '<i class="fas fa-comment-dots mr-1"></i>';

              if (supportType === "Latino" || supportType === "Castellano") {
                colorClass =
                  "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                icon = '<i class="fas fa-language mr-1"></i>';
              }

              return `<span class="px-2 py-1 flex-shrink-0 ${colorClass} text-[10px] font-bold rounded border lowercase inline-flex items-center" title="Soporte detectado en el título">${icon}${supportType}</span>`;
            };

            // data.results = [{"group_info": {...}, "torrents": [...]}]
            data.results.forEach((group) => {
              const info = group.group_info;
              const torrentsCount = group.torrents.length;

              let torrentsHTML = "";
              group.torrents.forEach((t) => {
                const badge = getQualityBadge(t.title);
                const safeMagnet = t.magnet
                  ? t.magnet.replace(/'/g, "\\'")
                  : "";

                const copyBtnHTML = t.magnet
                  ? `<button type="button" onclick="navigator.clipboard.writeText('${safeMagnet}').then(() => alert('¡Enlace Magnet copiado!'))" class="text-gray-400 hover:text-white transition-colors p-3 rounded-lg bg-white/5 hover:bg-violet-600/50" title="Copiar Magnet">
                                <i class="fas fa-copy"></i>
                            </button>`
                  : "";

                const downloadBtnHTML = t.magnet
                  ? `<a href="${t.magnet}" class="bg-violet-600 hover:bg-violet-500 text-white px-4 py-3 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors flex-grow md:flex-grow-0 justify-center">
                                <i class="fas fa-magnet"></i> Descargar
                            </a>`
                  : `<span class="text-xs text-gray-500">Sin link</span>`;

                const fullSeasonBadge = t.is_full_season
                  ? `<span class="px-2 py-1 bg-amber-500/20 text-amber-400 border-amber-500/30 flex-shrink-0 text-[10px] uppercase font-black rounded border"><i class="fas fa-star mr-1"></i>Temporada Completa</span>`
                  : "";

                torrentsHTML += `
                            <div class="bg-[#252a35] rounded-xl p-4 mb-3 border border-white/5 flex flex-col xl:flex-row gap-4 xl:items-center justify-between hover:border-violet-500/30 transition-colors">
                                <div class="flex-grow w-full overflow-hidden">
                                    <div class="flex flex-wrap items-center gap-2 mb-2">
                                        ${fullSeasonBadge}
                                        <span class="px-2 py-1 ${badge.class} flex-shrink-0 text-[10px] font-bold rounded border">${badge.text}</span>
                                        ${t.quality !== "Desconocida" ? `<span class="px-2 py-1 bg-gray-700 flex-shrink-0 text-gray-300 text-[10px] rounded">${t.quality}</span>` : ""}
                                        ${t.codec ? `<span class="px-2 py-1 bg-gray-700 text-gray-300 flex-shrink-0 text-[10px] rounded">${t.codec}</span>` : ""}
                                        ${getSpanishBadge(t.spanish_support)}
                                        <span class="text-blue-400 font-bold ml-auto flex-shrink-0">${t.size_gb} GB</span>
                                    </div>
                                    <p class="text-sm text-gray-400 mb-2 truncate" title="${t.title}">${t.title}</p>
                                    <div class="flex items-center gap-3 text-xs text-gray-500">
                                        <span><i class="fas fa-arrow-up text-green-500 mr-1"></i> ${t.seeders}</span>
                                        <span class="truncate"><i class="fas fa-server mr-1"></i> ${t.tracker}</span>
                                    </div>
                                </div>
                                <div class="flex items-center w-full xl:w-auto gap-2 mt-2 xl:mt-0">
                                    ${copyBtnHTML}
                                    ${downloadBtnHTML}
                                </div>
                            </div>
                        `;
              });

              const posterImg = info.poster_url
                ? `<img src="${info.poster_url}" alt="${info.title}" class="w-full h-[400px] object-cover object-top border-b border-white/10" loading="lazy">`
                : `<div class="w-full h-[400px] bg-gradient-to-b from-gray-800 to-[#1a1d24] flex items-center justify-center border-b border-white/10">
                               <i class="fas fa-film text-6xl text-gray-600"></i>
                           </div>`;

              const card = document.createElement("div");
              card.className = `movie-group-card group bg-[#1a1d24] border border-white/10 rounded-2xl overflow-hidden flex flex-col`;

              card.innerHTML = `
                        ${posterImg}
                        <div class="p-6 flex flex-col flex-grow">
                            <h3 class="text-2xl font-black text-white mb-2 leading-tight">${info.title} <span class="text-gray-500 font-normal">(${info.year || "?"})</span></h3>
                            <p class="text-sm text-gray-400 mb-6 line-clamp-3" title="${info.overview}">${info.overview}</p>
                            
                            <details class="group/details mt-auto">
                                <summary class="list-none cursor-pointer bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl p-4 font-bold text-center transition-colors flex items-center justify-center gap-2">
                                    <span class="text-violet-400">Ver ${torrentsCount} Torrents Disponibles</span>
                                    <i class="fas fa-chevron-down group-open/details:rotate-180 transition-transform text-white"></i>
                                </summary>
                                <div class="mt-4 pt-4 border-t border-white/5">
                                    ${torrentsHTML}
                                </div>
                            </details>
                        </div>
                    `;
              fragment.appendChild(card);
            });

            resultsList.appendChild(fragment);
          } catch (error) {
            errorMessage.textContent = error.message;
            errorBox.classList.remove("hidden");
          } finally {
            searchBtn.disabled = false;
            searchBtn.classList.remove("opacity-75", "cursor-not-allowed");
            btnText.textContent = "Buscar";
            btnSpinner.classList.add("hidden");
          }
        });
    </script>
  </body>
</html>
