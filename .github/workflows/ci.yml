name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rango soportado por el proyecto (AGENTS.md: Python 3.10 o superior)
        python-version: ["3.10", "3.12"]

    steps:
      # Versiones con runtime Node 24 (Node 20 quedó EOL en abril 2026 y
      # GitHub lo removió de los runners en septiembre 2026)
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Los tests de frontend usan node para validar app.js y escapeHtml()
      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar sintaxis del frontend
        run: node --check static/js/app.js

      - name: Correr tests con cobertura
        run: >-
          python -m pytest
          --cov=.
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
